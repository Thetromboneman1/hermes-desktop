name: Sync Fork From Upstream

on:
  schedule:
    - cron: "17 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: dodo-reach/hermes-desktop
  DOWNSTREAM_BRANCH: main

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      base: ${{ steps.candidate.outputs.base }}
      upstream: ${{ steps.candidate.outputs.upstream }}
      changed: ${{ steps.candidate.outputs.changed }}
      conflict: ${{ steps.candidate.outputs.conflict }}
      conflicts-b64: ${{ steps.candidate.outputs.conflicts_b64 }}
      tree: ${{ steps.candidate.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Resolve and reconstruct the downstream candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          git fetch --no-tags "https://github.com/${UPSTREAM_REPOSITORY}.git" main
          upstream=$(git rev-parse FETCH_HEAD)
          changed=true; conflict=false; conflicts=""; conflicts_b64=""; tree=""
          if git merge-base --is-ancestor "$upstream" "$base"; then
            changed=false
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            set +e; git merge --no-edit "$upstream"; status=$?; set -e
            if [[ "$status" -ne 0 ]]; then
              changed=false; conflict=true
              conflicts=$(git diff --name-only --diff-filter=U | head -50)
              conflicts_b64=$(printf '%s' "$conflicts" | base64 | tr -d '\n')
              git merge --abort
            else
              git restore --source="$base" --staged --worktree .github/workflows
              git commit --amend --no-edit
              tree=$(git rev-parse 'HEAD^{tree}')
            fi
          fi
          {
            echo "base=$base"; echo "upstream=$upstream"; echo "changed=$changed"
            echo "conflict=$conflict"; echo "tree=$tree"
            echo "conflicts_b64=$conflicts_b64"
          } >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.base }}
      - name: Validate exact candidate without credentials
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
          EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "$UPSTREAM_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit "$UPSTREAM_SHA"
          git restore --source="$BASE_SHA" --staged --worktree .github/workflows
          git commit --amend --no-edit
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          scripts/validate-downstream.sh

  finalize:
    needs: [prepare, validate]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ needs.prepare.outputs.base }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
      EXPECTED_TREE: ${{ needs.prepare.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.base }}
      - name: Publish exact validated tree without executing it
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]]
          actual=$(git ls-remote origin "refs/heads/${DOWNSTREAM_BRANCH}" | awk '{print $1}')
          test "$actual" = "$BASE_SHA"
          git fetch --no-tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "$UPSTREAM_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit "$UPSTREAM_SHA"
          git restore --source="$BASE_SHA" --staged --worktree .github/workflows
          git commit --amend --no-edit
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          branch="automation/upstream-sync-${UPSTREAM_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push --set-upstream origin "HEAD:refs/heads/$branch"
          url=$(gh pr create --head "$branch" --base "$DOWNSTREAM_BRANCH" \
            --title "chore: sync dodo-reach/hermes-desktop main" \
            --body "Merges \`${UPSTREAM_REPOSITORY}@${UPSTREAM_SHA}\`, preserves the downstream workflow overlay, and validates the Swift contract from base \`${BASE_SHA}\`.")
          if [[ "$(gh pr view "$url" --json baseRefOid --jq .baseRefOid)" != "$BASE_SHA" ]]; then
            gh pr close "$url" --delete-branch --comment "Closed automatically because the base branch advanced after validation."
            exit 1
          fi

  report-conflict:
    needs: prepare
    if: needs.prepare.outputs.conflict == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream }}
      CONFLICTS_B64: ${{ needs.prepare.outputs.conflicts-b64 }}
    steps:
      - name: Record merge conflict
        shell: bash
        run: |
          set -euo pipefail
          conflicts=$(printf '%s' "$CONFLICTS_B64" | base64 --decode)
          title="Hermes Desktop upstream sync conflict"
          body_file="$RUNNER_TEMP/hermes-desktop-upstream-conflict.md"
          # Markdown backticks are intentionally literal.
          # shellcheck disable=SC2016
          printf 'The review merge stopped without changing `%s`.\n\n- Upstream: `%s@%s`\n\n```text\n%s\n```\n' \
            "$DOWNSTREAM_BRANCH" "$UPSTREAM_REPOSITORY" "$UPSTREAM_SHA" "$conflicts" > "$body_file"
          issue_number=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$issue_number" ]]; then gh issue comment "$issue_number" --body-file "$body_file"; else gh issue create --title "$title" --body-file "$body_file"; fi
          cat "$body_file" >> "$GITHUB_STEP_SUMMARY"
          exit 1
